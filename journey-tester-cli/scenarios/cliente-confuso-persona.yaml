name: Remarcação — cliente confuso
description: >
  Roteiro fixo só testa o caminho feliz. Aqui o arquétipo `confused` escreve mal,
  mistura assuntos e não entende de primeira — caça o que roteiro não pega.

projectFile: ../projects/clinica-odonto.yaml

contact:
  phone: "5511988887777"
  name: Maria Teste

replyTimeoutMs: 30000
settleMs: 3000

persona:
  archetype: confused
  goal: >
    Descobrir se precisa levar algum documento na consulta e remarcar a consulta
    que já tem para a semana que vem.
  maxTurns: 10
  expect:
    - judge:
        criteria: >
          Ao longo da conversa a IA respondeu sobre documentos necessários E tratou o pedido de
          remarcação (remarcando, oferecendo horários, ou transferindo para um humano)
        mustNot: entrou em loop repetindo a mesma pergunta que o cliente já tinha respondido
    - judge:
        criteria: a IA manteve tom cordial e linguagem simples mesmo com o cliente confuso
